# The list of companies whose Careers pages will be searched goes here.
#
# Секоја компанија има:
#   name: име на компанијата (се прикажува во email-от)
#   type: кој систем за огласи го користи
#         (greenhouse, smartrecruiters, ashby, teamtailor, talentlyft, wordpress или jsonld)
#   и параметри според типот:
#     greenhouse      → board_token: името на компанијата во Greenhouse, од url-то
#                       boards-api.greenhouse.io/v1/boards/<board_token>/jobs
#     smartrecruiters → company_id: името на компанијата во SmartRecruiters, од url-то
#                       jobs.smartrecruiters.com/<company_id>
#     ashby           → job_board_name: името на компанијата во Ashby, од url-то
#                       jobs.ashbyhq.com/<job_board_name> (празните места се дозволени)
#     teamtailor      → career_domain: доменот на Teamtailor career страницата,
#                       без https:// (на пр. career.nionit.com)
#     talentlyft      → career_domain: доменот на TalentLyft career страницата,
#                       без https:// (на пр. careers.htecgroup.com)
#     wordpress       → domain: доменот на WordPress сајтот, без https://
#                       post_type: типот на објави за огласи, од url-то
#                       <domain>/wp-json/wp/v2/<post_type> (на пр. jobs)
#     jsonld          → careers_url: целосниот линк до careers страницата што има
#                       schema.org JobPosting податоци (JSON-LD)

companies:
  - name: Loka
    type: greenhouse
    board_token: lokainc

  - name: Endava
    type: smartrecruiters
    company_id: Endava

  - name: IT Labs
    type: ashby
    job_board_name: IT Labs

  - name: Nion
    type: teamtailor
    career_domain: career.nionit.com

  - name: HTEC
    type: talentlyft
    career_domain: careers.htecgroup.com

  - name: iBorn
    type: teamtailor
    career_domain: careers.iborn.net

  - name: Proton
    type: greenhouse
    board_token: proton

  - name: Solutionade
    type: wordpress
    domain: www.solutionade.net
    post_type: jobpost

  - name: AXM365
    type: wordpress
    domain: careers.axm365.com
    post_type: jobs

  - name: Slice
    type: greenhouse
    board_token: slice

  - name: vector8
    type: jsonld
    careers_url: https://www.vector8.com/en/careers
