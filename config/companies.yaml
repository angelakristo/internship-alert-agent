# Companies whose careers pages are read through a supported job-board system (ATS).
# Each entry needs a name, a type, and the parameters that type requires (see ATS_SCRAPERS in main.py).

companies:
  - name: Loka
    type: greenhouse
    board_token: lokainc

  - name: Endava
    type: smartrecruiters
    company_id: Endava

  - name: IT Labs
    type: ashby
    job_board_name: IT Labs

  - name: Nion
    type: teamtailor
    career_domain: career.nionit.com

  - name: HTEC
    type: talentlyft
    career_domain: careers.htecgroup.com

  - name: iBorn
    type: teamtailor
    career_domain: careers.iborn.net

  - name: Proton
    type: greenhouse
    board_token: proton

  - name: Solutionade
    type: wordpress
    domain: www.solutionade.net
    post_type: jobpost

  - name: Slice
    type: greenhouse
    board_token: slice

  - name: vector8
    type: jsonld
    careers_url: https://www.vector8.com/en/careers
