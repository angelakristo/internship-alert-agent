# GitHub Actions workflow that runs the internship alert agent every 6 hours
# and commits the seen-jobs database and monthly heartbeat back to the repository.

name: Check internships

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: check-internships
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        run: python main.py
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}

      - name: Update heartbeat
        if: always()
        run: |
          HEARTBEAT=data/last_heartbeat.txt
          TODAY=$(date -u +%Y-%m-%d)

          if [ -f "$HEARTBEAT" ] && LAST=$(date -u -d "$(cat "$HEARTBEAT")" +%s 2>/dev/null); then
            DAYS=$(( ( $(date -u +%s) - LAST ) / 86400 ))
          else
            DAYS=9999
          fi

          if [ "$DAYS" -ge 30 ]; then
            echo "$TODAY" > "$HEARTBEAT"
            echo "Heartbeat ажуриран на $TODAY."
          else
            echo "Последниот heartbeat е пред $DAYS дена, нема потреба од нов."
          fi

      - name: Commit updated database
        if: always()
        run: |
          FILES=""
          for FILE in data/jobs.db data/last_heartbeat.txt; do
            if [ -f "$FILE" ] && [ -n "$(git status --porcelain "$FILE")" ]; then
              FILES="$FILES $FILE"
            fi
          done

          if [ -z "$FILES" ]; then
            echo "Нема променети фајлови за commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add $FILES
          git commit -m "Update seen jobs [skip ci]"
          git pull --rebase
          git push
