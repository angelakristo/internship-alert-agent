# Име на workflow-от, како што ќе се прикажува во табот „Actions“ на GitHub.
name: Check internships

# Кога се стартува workflow-от.
on:
  # Автоматски на секои 6 часа (00:00, 06:00, 12:00, 18:00 по UTC).
  schedule:
    - cron: "0 */6 * * *"
  # Рачно, со копчето „Run workflow“ во табот Actions.
  workflow_dispatch:

# Не дозволуваме две проверки истовремено. Ако едната уште работи,
# новата чека да заврши (не ја прекинуваме, за да не се изгуби запишувањето во базата).
concurrency:
  group: check-internships
  cancel-in-progress: false

# Дозвола workflow-от да прави commit и push (за базата со видени огласи).
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      # 1. Го симнуваме кодот од репото (заедно со data/jobs.db ако постои).
      - name: Checkout
        uses: actions/checkout@v5

      # 2. Инсталираме Python 3.12. "cache: pip" ги памети симнатите пакети
      #    помеѓу извршувањата, за инсталацијата да биде побрза.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # 3. Ги инсталираме пакетите од requirements.txt.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. Го стартуваме агентот. Поставките за email доаѓаат од GitHub Secrets
      #    (Settings → Secrets and variables → Actions), а не од .env фајл.
      - name: Run agent
        run: python main.py
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}

      # 5. Ако базата е променета, ја враќаме во репото за следното извршување
      #    да знае кои огласи се веќе видени.
      #    if: always() значи дека чекорот се извршува дури и ако претходниот
      #    падне (на пр. main.py завршил со код 1 поради паднат scraper,
      #    а email-от сепак е испратен и базата е ажурирана).
      - name: Commit updated database
        if: always()
        run: |
          # Ако базата не постои (на пр. агентот паднал пред да ја креира), нема што да правиме.
          if [ ! -f data/jobs.db ]; then
            echo "data/jobs.db не постои, нема што да се commit-не."
            exit 0
          fi

          # "git status --porcelain" печати нешто само ако фајлот е нов или променет.
          if [ -z "$(git status --porcelain data/jobs.db)" ]; then
            echo "Базата не е променета."
            exit 0
          fi

          # Се претставуваме како официјалниот GitHub Actions бот.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/jobs.db
          # [skip ci] во пораката спречува овој commit да стартува нов workflow.
          git commit -m "Update seen jobs [skip ci]"
          # Ако во меѓувреме некој направил push, прво ги земаме тие промени.
          git pull --rebase
          git push
